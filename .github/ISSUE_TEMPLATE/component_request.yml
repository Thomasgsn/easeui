name: Component request
description: Suggest a new component or a feature for an existing one.
labels: ["enhancement"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: An existing slug to extend, or a name for a new one.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What it is for
      description: Where you would use it and what it should do.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: References
      description: Links, screenshots, or recordings of something similar.
