name: Bug report
description: A component looks or behaves wrong.
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: The component's slug, such as tooltip or otp-input.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what you saw instead, and the steps to get there.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Such as Safari 18 on iPhone, or Chrome 130 on Windows.
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A link to a sandbox or a minimal code snippet, if you have one.
      render: tsx
